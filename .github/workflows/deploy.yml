# Builds the Angular site and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://ramrajamahanthi.com
name: Deploy to ramrajamahanthi.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/rams-portfolio/browser
          publish_branch: gh-pages
          cname: ramrajamahanthi.com
          user_name: Ram
          user_email: rramprabhakar@gmail.com
          commit_message: "Deploy portfolio to ramrajamahanthi.com"
